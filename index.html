<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Style this h2 -->
    <h2 style="font-family: monospace; font-size: 24pt; font-weight: bolder; text-transform: uppercase; color: #081131;">Minesweeper</h2>
    <div id="game-grid" class="game-grid">
    </div>
    <header class="game-header">
        <p class="stat">Time: <span id="time">00</span>s</p>
        <p class="stat">Wins: <span id="wins">00</span></p>
        <button id="playagain-button" class="playagain-button">New Game</button>
    </header>
    <script src="./js/script.js"></script>
</body>
</html>
